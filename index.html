<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出海航海日志</title>
<style>
  :root{ color-scheme: dark; --sea:#0B1C29; --sea2:#0F2534; --foam:#EAF2F4; --foam2:#93A8B3; --signal:#F2562B; --teal:#57A8B4; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: radial-gradient(1200px 800px at 50% -10%, #143343 0%, #0B1C29 55%, #07131d 100%);
    color:var(--foam);
    font-family:"IBM Plex Sans",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px; padding-left:max(20px, env(safe-area-inset-left)); padding-right:max(20px, env(safe-area-inset-right));
  }
  .gate{ width:100%; max-width:400px; text-align:center; }
  .rose{ margin:0 auto 22px; display:block; }
  h1{ font-family:"Fraunces",Georgia,"Songti SC",serif; font-weight:560; font-size:clamp(1.6rem,6vw,2.3rem); margin:0 0 8px; letter-spacing:-.01em; }
  .sub{ color:var(--foam2); font-size:14px; margin:0 0 28px; }
  form{ display:flex; flex-direction:column; gap:12px; }
  input{
    width:100%; font:inherit; font-size:16px; padding:14px 16px; border-radius:4px;
    border:1px solid rgba(147,168,179,.35); background:var(--sea2); color:var(--foam); letter-spacing:.08em;
  }
  input:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color:transparent; }
  button{ font:inherit; font-weight:600; font-size:16px; padding:14px; border:0; border-radius:4px; background:var(--signal); color:#fff; cursor:pointer; }
  button:hover{ filter:brightness(1.06); }
  button:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .err{ color:var(--signal); font-size:13px; min-height:18px; }
  .hint{ color:var(--foam2); font-size:12px; margin-top:20px; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="gate">
  <svg class="rose" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
    <circle cx="23" cy="23" r="21" fill="none" stroke="rgba(147,168,179,.4)"/>
    <path d="M23 5 L27 23 L23 41 L19 23 Z" fill="var(--signal)"/>
    <path d="M5 23 L23 19 L41 23 L23 27 Z" fill="rgba(147,168,179,.55)"/>
    <circle cx="23" cy="23" r="3" fill="var(--foam)"/>
  </svg>
  <h1>出海航海日志</h1>
  <p class="sub">此页需密码访问</p>
  <form id="f">
    <input id="pw" type="password" placeholder="输入密码" autocomplete="off" aria-label="密码">
    <button type="submit">进入</button>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
  </form>
  <p class="hint">密码由作者提供</p>
</div>

function b64(b){ return Uint8Array.from(atob(b), c=>c.charCodeAt(0)); }
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var err = document.getElementById('err');
  var pw = document.getElementById('pw').value;
  if(!pw){ err.textContent='请输入密码'; return; }
  try{
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SALT), iterations:210000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV), tagLength:128}, key, b64(DATA));
    var html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(err2){
    err.textContent='密码不对，再试一次';
    document.getElementById('pw').select();
  }
});
</script>
